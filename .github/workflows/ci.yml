name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "templates/podman-template/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "templates/podman-template/**"

jobs:
  provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/podman-template/providers/llm01_workspace_target
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - name: Install protoc (pinned release) and musl
        run: |
          set -euo pipefail
          # Avoid the flaky/slow 'apt-get install protobuf-compiler': fetch a
          # pinned protoc release and unpack with python3 (present on the runner)
          # so the only apt dependency is the small musl toolchain.
          protoc_version=25.1
          arch=$(uname -m); case "$arch" in aarch64*) arch=aarch_64;; esac
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-${arch}.zip"
          curl -fsSL --retry 3 "$url" -o /tmp/protoc.zip
          python3 - <<'PY'
          import os, shutil, zipfile
          tmp = "/tmp/protoc-extract"
          shutil.rmtree(tmp, ignore_errors=True)
          os.makedirs(tmp, exist_ok=True)
          zipfile.ZipFile("/tmp/protoc.zip").extractall(tmp)
          PY
          sudo mkdir -p /usr/local/bin /usr/local/include
          sudo cp -a /tmp/protoc-extract/bin/protoc /usr/local/bin/protoc
          sudo cp -a /tmp/protoc-extract/include/google /usr/local/include/google
          sudo chmod +x /usr/local/bin/protoc
          rm -rf /tmp/protoc-extract /tmp/protoc.zip
          protoc --version
          sudo apt-get update \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends musl-tools
          musl-gcc --version | head -1

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - name: Test
        run: cargo test --target x86_64-unknown-linux-musl

      - name: Build release binary
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin terraform-provider-llm01

      - name: Upload provider binary
        uses: actions/upload-artifact@v4
        with:
          name: llm01-provider-linux-amd64
          path: templates/podman-template/providers/llm01_workspace_target/target/x86_64-unknown-linux-musl/release/terraform-provider-llm01

  terraform:
    runs-on: ubuntu-latest
    needs: provider
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Validate compatibility gate (public registry)
        working-directory: templates/podman-template/compatibility
        run: |
          terraform init -input=false
          terraform validate

      - name: Download provider binary
        uses: actions/download-artifact@v4
        with:
          name: llm01-provider-linux-amd64
          path: .ci/llm01-provider

      - name: Install llm01 provider into local filesystem mirror
        shell: bash
        run: |
          set -euo pipefail
          PKG="$HOME/.tf-mirror/registry.l.arrieta.eu/infra/llm01/0.1.3/linux_amd64"
          mkdir -p "$PKG"
          cp .ci/llm01-provider/terraform-provider-llm01 "$PKG/terraform-provider-llm01_v0.1.3"
          chmod +x "$PKG/terraform-provider-llm01_v0.1.3"
          # Unquoted EOF: $HOME must expand at write time because Terraform
          # does NOT interpolate env vars inside its CLI config file.
          cat > "$HOME/.terraformrc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$HOME/.tf-mirror"
              include = ["registry.l.arrieta.eu/infra/llm01"]
            }
            direct {
              exclude = ["registry.l.arrieta.eu/infra/llm01"]
            }
          }
          EOF

      - name: Validate template against local mirror
        working-directory: templates/podman-template
        run: |
          terraform init -input=false
          terraform validate